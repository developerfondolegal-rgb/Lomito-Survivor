<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Celular: sin zoom con dos dedos ni doble toque, y usa toda la pantalla (también con muesca) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <!-- iPhone: "Compartir → Agregar a inicio" abre el juego como app, sin barra del navegador -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lomito Survivor">
  <meta name="application-name" content="Lomito Survivor">
  <link rel="manifest" href="manifest.json?v=0.24">
  <link rel="apple-touch-icon" href="icons/icono-180.png?v=0.24">
  <link rel="icon" type="image/png" href="icons/icono-192.png?v=0.24">
  <title>Lomito Survivor</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;            /* sin scroll */
      overscroll-behavior: none;   /* sin "tirar para recargar" */
      touch-action: none;          /* sin zoom ni gestos del navegador */
      -webkit-user-select: none;   /* sin seleccionar texto */
      user-select: none;
      -webkit-touch-callout: none; /* sin menú al mantener presionado */
      -webkit-tap-highlight-color: transparent;
    }
    /* Marco del juego: ocupa solo la parte VISIBLE de la pantalla (sin la barra del
       navegador) y deja libre la zona del notch y de las esquinas redondeadas.
       src/tactil.js actualiza --alto-visible y --arriba-visible al girar o cuando
       aparece/desaparece la barra del navegador. */
    #marco {
      position: fixed;
      left: 0;
      top: var(--arriba-visible, 0px);
      width: 100%;
      height: 100vh;                           /* navegadores viejos */
      height: 100dvh;                          /* altura visible real */
      height: var(--alto-visible, 100dvh);     /* medida con visualViewport */
      box-sizing: border-box;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
               env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    #game {
      width: 100%;
      height: 100%;
      /* Phaser centra el canvas solo (autoCenter); centrarlo también aquí lo corría el doble */
    }
    canvas { touch-action: none; }

    /* Aviso "Gira el celular" (solo en celular y en vertical; lo activa src/tactil.js) */
    #gira {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
      color: #ffe082;
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    body.vertical #gira { display: flex; }
    #gira small { color: #cfd8dc; font-size: 15px; font-weight: normal; }
    #gira svg { animation: girar 2s ease-in-out infinite; }
    @keyframes girar {
      0%, 25% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
  </style>
</head>
<body>
  <div id="marco"><div id="game"></div></div>

  <!-- Se ve solo con el celular en vertical -->
  <div id="gira">
    <svg width="90" height="140" viewBox="0 0 90 140" aria-hidden="true">
      <rect x="5" y="5" width="80" height="130" rx="10" fill="#1d1b2e" stroke="#ffe082" stroke-width="6"/>
      <rect x="15" y="20" width="60" height="95" fill="#3a5a2a"/>
      <rect x="38" y="122" width="14" height="5" rx="2" fill="#ffe082"/>
      <rect x="35" y="60" width="20" height="12" fill="#8b5a2b"/>
      <rect x="51" y="55" width="8" height="8" fill="#8b5a2b"/>
    </svg>
    <div>Gira el celular</div>
    <small>Lomito Survivor se juega en horizontal</small>
  </div>

  <!-- Phaser 3 desde CDN (requiere internet la primera vez) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Supabase (login con Google y ranking online). Si no carga, el juego funciona igual sin ranking -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <!-- Scripts normales (no "module") para que funcione con doble clic -->
  <script src="src/config.js?v=0.24"></script>
  <script src="src/instintos.js?v=0.24"></script>
  <script src="src/razas.js?v=0.24"></script>
  <script src="src/enemigos.js?v=0.24"></script>
  <script src="src/sprites.js?v=0.24"></script>
  <script src="src/razas_sprites.js?v=0.24"></script>
  <script src="src/objetos.js?v=0.24"></script>
  <script src="src/mapa.js?v=0.24"></script>
  <script src="src/mapas.js?v=0.24"></script>
  <script src="src/noche.js?v=0.24"></script>
  <script src="src/jefe.js?v=0.24"></script>
  <script src="src/sinergias.js?v=0.24"></script>
  <script src="src/zonas.js?v=0.24"></script>
  <script src="src/desafios.js?v=0.24"></script>
  <script src="src/pausa.js?v=0.24"></script>
  <script src="src/coleccionables.js?v=0.24"></script>
  <script src="src/huesitos.js?v=0.24"></script>
  <script src="src/arbol.js?v=0.24"></script>
  <script src="src/tactil.js?v=0.24"></script>
  <script src="src/online.js?v=0.24"></script>
  <script src="src/ataques.js?v=0.24"></script>
  <script src="src/ataques_nuevos.js?v=0.24"></script>
  <script src="src/portada_perros.js?v=0.24"></script>
  <script src="src/portada.js?v=0.24"></script>
  <script src="src/scenes/BienvenidaScene.js?v=0.24"></script>
  <script src="src/scenes/MenuScene.js?v=0.24"></script>
  <script src="src/scenes/MapaScene.js?v=0.24"></script>
  <script src="src/scenes/GameScene.js?v=0.24"></script>
  <script src="src/scenes/AlbumScene.js?v=0.24"></script>

</body>
</html>
